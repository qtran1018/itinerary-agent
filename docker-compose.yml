services:
  itinerary-db:
    image: postgres:16
    container_name: itinerary-db
    profiles: ["standalone"]
    environment:
      POSTGRES_DB: itinerary_agent
      POSTGRES_USER: itinerary_user
      POSTGRES_PASSWORD: itinerary_pass
    ports:
      - "5434:5432"
    volumes:
      - itinerary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinerary_user -d itinerary_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelplatform-network

  itinerary-agent-backend:
    build: ./itinerary-agent-backend
    container_name: itinerary-agent-backend
    env_file:
      - ./itinerary-agent-backend/.env
    environment:
      # DB — overrides .env so the backend reaches the DB by container name (not localhost)
      - DATABASE_URL=postgresql://itinerary_user:itinerary_pass@${POSTGRES_HOST:-platform-postgres}:5432/itinerary_agent
      - KEYCLOAK_ISSUER=https://auth.quangntran.com/realms/travel-platform
      - KEYCLOAK_JWKS_URL=https://auth.quangntran.com/realms/travel-platform/protocol/openid-connect/certs
      # TravelBin — internal network hostname, not localhost
      - TRAVELBIN_API_URL=http://travelbin-backend:8000
    depends_on:
      itinerary-db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      - travelplatform-network

  itinerary-agent-frontend:
    build: ./itinerary-agent
    container_name: itinerary-agent-frontend
    environment:
      - VITE_BACKEND_URL=http://itinerary-agent-backend:5000
    ports:
      - "3010:3000"
    restart: unless-stopped
    networks:
      - travelplatform-network
    depends_on:
      - itinerary-agent-backend

networks:
  travelplatform-network:
    external: true

volumes:
  itinerary-db-data:
